<title id="title">Saif Alshalabi — SHLBI / Build Lab</title><desc id="desc">Developer tools. Applied AI. Things that should exist. Computer science at UNC Charlotte; currently building REPOT. A modular S slowly disassembles and reconnects.</desc>
